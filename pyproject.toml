[project]
name = "brasa"
version = "0.3.1"
description = "MicroPython developer tools — flash, deploy, watch, monitor."
readme = "README.md"
authors = [
    { name = "Martin Miglio", email = "marmig0404@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12.0,<1.0",
    "pyserial>=3.5,<4.0",
    "watchfiles>=0.24.0,<2.0",
    "mpremote>=1.24.0,<2.0",
    "httpx>=0.25.0,<0.30.0",
    "esptool>=4.7.0,<6.0",
    "questionary>=2.0.0,<3.0.0",
]

[project.scripts]
brasa = "brasa.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15.8",
    "ty>=0.0.26",
    "pytest",
    "pytest-mock",
    "pytest-subprocess",
    "pytest-cov",
    "pytest-timeout",
    "pre-commit>=4.5.1",
    "freezegun>=1.5.5",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: marks tests that require physical hardware (deselect with '-m \"not hardware\"')",
]
timeout = 10

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
